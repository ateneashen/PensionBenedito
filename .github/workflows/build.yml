# =============================================================================
# GitHub Actions Workflow: Build and Test
# =============================================================================
# This workflow automatically builds and tests the project on push/PR
# =============================================================================

name: Build and Test

# Trigger on push to main/develop and pull requests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Environment variables
env:
  UE_VERSION: "4.27"
  PROJECT_NAME: "PensionBenedito"

# Jobs to run
jobs:
  # Job 1: Validate project structure
  validate:
    name: Validate Project Structure
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check required files
        run: |
          echo "Checking required files..."
          required_files=(
            "README.md"
            "CHANGELOG.md"
            "LICENSE"
            ".gitignore"
            ".gitattributes"
          )
          
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ $file missing"
              exit 1
            fi
          done
          
          echo ""
          echo "✅ All required files present"
      
      - name: Check directory structure
        run: |
          echo "Checking directory structure..."
          required_dirs=(
            "Source"
            "Content"
            "Scripts"
          )
          
          for dir in "${required_dirs[@]}"; do
            if [ -d "$dir" ]; then
              echo "✅ $dir/ exists"
            else
              echo "❌ $dir/ missing"
              exit 1
            fi
          done
          
          echo ""
          echo "✅ Directory structure valid"

  # Job 2: Check code quality
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check C++ files syntax
        run: |
          echo "Checking C++ file syntax..."
          
          # Find all .h and .cpp files
          cpp_files=$(find Source -name "*.h" -o -name "*.cpp" 2>/dev/null | head -100)
          
          if [ -z "$cpp_files" ]; then
            echo "⚠️  No C++ files found"
            exit 0
          fi
          
          errors=0
          for file in $cpp_files; do
            # Check for common issues
            if grep -q "TObjectPtr" "$file"; then
              echo "⚠️  $file uses TObjectPtr (UE5 only)"
              ((errors++))
            fi
            
            if grep -q "#include.*generated.h" "$file" && ! tail -1 "$file" | grep -q "generated.h"; then
              echo "⚠️  $file: .generated.h should be last include"
              ((errors++))
            fi
          done
          
          if [ $errors -gt 0 ]; then
            echo ""
            echo "❌ Found $errors potential issues"
            exit 1
          else
            echo ""
            echo "✅ No syntax issues found"
          fi
      
      - name: Check documentation
        run: |
          echo "Checking documentation..."
          
          # Check if README has required sections
          if grep -q "## Getting Started" README.md; then
            echo "✅ README has Getting Started section"
          else
            echo "⚠️  README missing Getting Started section"
          fi
          
          if grep -q "## Documentation" README.md; then
            echo "✅ README has Documentation section"
          else
            echo "⚠️  README missing Documentation section"
          fi

  # Job 3: Generate build report
  report:
    name: Generate Build Report
    runs-on: ubuntu-latest
    needs: [validate, code-quality]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Generate report
        run: |
          echo "📊 Build Report" > build-report.txt
          echo "================" >> build-report.txt
          echo "" >> build-report.txt
          echo "Date: $(date)" >> build-report.txt
          echo "Branch: $(git branch --show-current)" >> build-report.txt
          echo "Commit: $(git rev-parse --short HEAD)" >> build-report.txt
          echo "" >> build-report.txt
          echo "Project Structure:" >> build-report.txt
          find . -maxdepth 2 -type d | sort >> build-report.txt
          echo "" >> build-report.txt
          echo "C++ Files:" >> build-report.txt
          find Source -name "*.cpp" -o -name "*.h" | wc -l >> build-report.txt
          echo "" >> build-report.txt
          echo "✅ Build validation passed" >> build-report.txt
      
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.txt